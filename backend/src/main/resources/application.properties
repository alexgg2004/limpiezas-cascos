# Servidor
server.port=${PORT:8080}

# Base de datos (nombres exactos de tu docker-compose)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seguridad JWT y Subida de Archivos
jwt.secret=${JWT_SECRET}
app.upload.dir=${app.upload.dir}

# Login con Google (Client ID de la app OAuth)
app.google.client-id=${GOOGLE_CLIENT_ID:}
# La lista de correos permitidos vive en la tabla correos_permitidos (se gestiona
# vía API, sin reiniciar el backend). Esta variable solo se usa una vez, para
# migrar automáticamente el valor anterior a la tabla si esta aún está vacía.
app.google.allowed-emails-seed=${GOOGLE_ALLOWED_EMAILS:}

# Registro con email/contraseña: exige esta clave de invitación (vacía = registro cerrado)
app.registro.clave-invitacion=${INVITATION_CODE:}

# L\u00EDmites Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB