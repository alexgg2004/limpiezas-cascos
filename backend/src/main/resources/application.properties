# Servidor
server.port=${PORT:8080}

# Base de datos (nombres exactos de tu docker-compose)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seguridad JWT
jwt.secret=${JWT_SECRET}

# Almacenamiento de facturas en Cloudflare R2 (https://dash.cloudflare.com/ > R2)
app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.bucket=${R2_BUCKET_NAME:facturas}

# Login con Google (Client ID de la app OAuth)
app.google.client-id=${GOOGLE_CLIENT_ID:}
# La lista de correos permitidos vive en la tabla correos_permitidos (se gestiona
# vía API, sin reiniciar el backend). Esta variable solo se usa una vez, para
# migrar automáticamente el valor anterior a la tabla si esta aún está vacía.
app.google.allowed-emails-seed=${GOOGLE_ALLOWED_EMAILS:}

# Registro con email/contraseña: exige esta clave de invitación (vacía = registro cerrado)
app.registro.clave-invitacion=${INVITATION_CODE:}

# L\u00EDmites Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB