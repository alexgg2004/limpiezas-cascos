# Servidor
server.port=${PORT:8080}

# Base de datos (nombres exactos de tu docker-compose)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seguridad JWT
jwt.secret=${JWT_SECRET}

# Almacenamiento de facturas en Backblaze B2 (https://www.backblaze.com/cloud-storage)
# Endpoint y region exactos de tu bucket, tal cual los muestra el panel de B2
# (p.ej. endpoint=https://s3.us-west-004.backblazeb2.com region=us-west-004)
app.b2.endpoint=${B2_ENDPOINT:}
app.b2.region=${B2_REGION:}
app.b2.key-id=${B2_KEY_ID:}
app.b2.application-key=${B2_APPLICATION_KEY:}
app.b2.bucket=${B2_BUCKET_NAME:facturas}

# Login con Google (Client ID de la app OAuth)
app.google.client-id=${GOOGLE_CLIENT_ID:}
# La lista de correos permitidos vive en la tabla correos_permitidos (se gestiona
# vía API, sin reiniciar el backend). Esta variable solo se usa una vez, para
# migrar automáticamente el valor anterior a la tabla si esta aún está vacía.
app.google.allowed-emails-seed=${GOOGLE_ALLOWED_EMAILS:}

# Registro con email/contraseña: exige esta clave de invitación (vacía = registro cerrado)
app.registro.clave-invitacion=${INVITATION_CODE:}

# L\u00EDmites Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB